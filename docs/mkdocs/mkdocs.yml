# MkDocs config lives in docs/mkdocs/; paths below are relative to this file.
# Build: just docs-build   or: mkdocs build --site-dir ../../site (from docs/mkdocs)

site_name: SHADI
site_description: Secure Host Agentic AI Dynamic Instantiation
# Local `mkdocs serve` must use a site_url *without* a path segment, or only /shadi/... URLs work (404 at /).
# CI sets MKDOCS_SITE_URL for production builds. Default: local dev server root.
site_url: !ENV [MKDOCS_SITE_URL, 'http://127.0.0.1:8000/']

docs_dir: ../content

repo_url: https://github.com/agntcy/shadi
repo_name: shadi
edit_uri: edit/main/docs/content/

extra:
  copyright: >
    Copyright SHADI Contributors.

extra_css:
  - stylesheets/custom.css
  - stylesheets/shadi-landing.css
  - stylesheets/shadictl-terminal.css

extra_javascript:
  - javascripts/card-links.js
  - javascripts/external-links.js
  - javascripts/shadictl-demo-data.js
  - javascripts/shadictl-terminal.js

theme:
  name: material
  custom_dir: overrides
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  logo_light: assets/img/logo-light.svg
  logo_dark: assets/img/logo-dark.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Introduction:
      - Overview: overview.md
      - Architecture: architecture.md
      - Security Notes: security.md
      - Design Overview: design.md
  - Guides:
      - Install the CLI: install.md
      - Getting Started: getting_started.md
      - Operations: operations.md
      - Telemetry: telemetry.md
      - Sandbox and Policies: sandbox.md
  - Integrations:
      - API Guide: api_integration.md
      - SLIM and A2A: slim_a2a.md
      - Secure Agent Group Demo: demos/did-agent-group.md
      - Agent Directory Discovery Demo: demos/dir-group-discovery.md
      - AgentBridge: agentbridge.md
      - Mobile: mobile_integration.md
  - Reference:
      - CLI Reference: cli.md
  - Community: community.md

exclude_docs: |
  README.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - toc:
      permalink: true
  - codehilite

plugins:
  - search
