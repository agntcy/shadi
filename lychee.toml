# Link-check config for `lychee` (https://lychee.cli.rs).
# Run locally with `just docs-lint-links`.

# MkDocs pretty URLs (`getting_started/`) resolve to `getting_started.md`.
fallback_extensions = ["md"]

# Skip example URLs inside fenced code and `<pre>` / `<code>`.
include_verbatim = false

# Do not probe 127.0.0.1 / localhost demo endpoints.
exclude_loopback = true

# crates.io (and some other hosts) rate-limit by source IP, and on shared CI
# runners that IP is not ours to control — a single link can be throttled
# because of unrelated traffic. A 429 means the host answered and the URL is
# live, so it is not a broken link. Listing `accept` replaces lychee's default
# success range, so the 2xx range has to be named explicitly here.
accept = ["200..=299", "429"]

max_retries = 3
retry_wait_time = 2
timeout = 20
max_redirects = 10

# Quiet enough for CI; just still prints the command.
no_progress = true

# In-page anchors are enabled via `--include-fragments` on the just/CI
# command so both lychee 0.21 and 0.24 accept the same config file.
