[workspace]
members = [
  "crates/agent_secrets",
  "crates/agent_transport_slim",
  "crates/shadi_a2a",
  "examples/shadi_demo_bot",
  "examples/agentbridge_demo",
  "crates/shadi_mas",
  "crates/agentbridge",
  "crates/agentbridge_cli",
  "crates/slim_mas",
  "crates/shadi_identity",
  "crates/shadi_memory",
  "crates/shadi_credential",
  "crates/shadi_py",
  "crates/shadi_sandbox",
  "crates/shadi_telemetry",
  "crates/shadictl",
  "apps/shadi_desktop/src-tauri"
]
default-members = [
  "crates/agent_secrets",
  "crates/agent_transport_slim",
  "crates/shadi_a2a",
  "examples/shadi_demo_bot",
  "examples/agentbridge_demo",
  "crates/shadi_mas",
  "crates/agentbridge",
  "crates/agentbridge_cli",
  "crates/slim_mas",
  "crates/shadi_identity",
  "crates/shadi_memory",
  "crates/shadi_credential",
  "crates/shadi_py",
  "crates/shadi_sandbox",
  "crates/shadi_telemetry",
  "crates/shadictl"
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/agntcy/shadi"
rust-version = "1.98"

# Pinned workspace-wide: two crates open SQLCipher databases and Cargo allows
# only one `links = "sqlite3"` crate, so a drifted version breaks the build.
# Stay on 0.37 until mls-rs-provider-sqlite (via SLIM 3.2.1) leaves ^0.37 — 0.38+
# pulls libsqlite3-sys 0.36+, which cannot coexist with the 0.35 SLIM locks.
[workspace.dependencies]
rusqlite = "0.37"
