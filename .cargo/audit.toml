# cargo-audit configuration. Unmaintained, unsound and yanked advisories are
# warnings here, not failures, so only genuine vulnerabilities need an entry.

[advisories]
ignore = [
	# Marvin Attack, a timing sidechannel in RSA private-key operations, with no
	# fixed release published. It reaches us through sequoia-openpgp's crypto-rust
	# backend in shadictl, which only parses certificates and pulls Ed25519 public
	# keys out of them (identity_command::extract_ed25519_public_key) — shadictl
	# performs no RSA decryption, so the vulnerable path is never entered. Drop
	# this entry once rsa ships a constant-time release.
	"RUSTSEC-2023-0071",
	# Timing variability in crypto-bigint operations meant to be constant-time.
	# Only the 0.5.5 copy is left, pinned by cx448 — which has one published
	# version — through sequoia-openpgp's crypto-rust backend. It sits behind
	# shadi_identity's opt-in openpgp feature, whose one entry point
	# (openpgp::ed25519_public_key) parses a certificate and returns Ed25519
	# public key bytes, so no secret operand ever reaches crypto-bigint and a
	# timing sidechannel needs one. Drop this entry once cx448 takes 0.7.6.
	"RUSTSEC-2026-0387",
	# SQLite before 3.54.0 can return uninitialized page-cache memory when a
	# database is opened next to a `-wal` file with a mismatched page size —
	# an information leak a local, unprivileged attacker triggers by planting
	# that sibling file. Reaches us through rusqlite's bundled-sqlcipher
	# feature (shadi_credential's vault, shadi_memory's store). The generic
	# fix, libsqlite3-sys >=0.39.0, does not cover this: that feature vendors
	# SQLite through the separate sqlcipher-src crate, and 0.39.0/0.39.1 (the
	# latest release) hard-pin sqlcipher-src =419.0.6, which still bundles
	# SQLite 3.53.4. sqlcipher-src 420.0.0 (bundling 3.54.1) exists, but no
	# libsqlite3-sys release depends on it yet. Both stores chmod their
	# database file 0600, which SQLite also applies to its journal/WAL
	# siblings, narrowing the attacker to one who already has local access to
	# the store's directory. Drop this entry once libsqlite3-sys depends on
	# sqlcipher-src >=420.0.0.
	"RUSTSEC-2026-0459",
]
