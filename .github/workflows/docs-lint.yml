name: Docs lint

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "**/*.md"
      - "typos.toml"
      - ".markdownlint-cli2.jsonc"
      - "lychee.toml"
      - "just/core.just"
      - "Justfile"
      - ".github/workflows/docs-lint.yml"
  pull_request:
    paths:
      - "docs/**"
      - "**/*.md"
      - "typos.toml"
      - ".markdownlint-cli2.jsonc"
      - "lychee.toml"
      - "just/core.just"
      - "Justfile"
      - ".github/workflows/docs-lint.yml"
  workflow_dispatch:

# Least privilege by default; jobs widen it where they need to.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check spelling
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: docs/content/**/*.md

  links:
    name: Links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install lychee
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: lychee@0.24.2
      - name: Check links
        # Links into this repo are checked as files in the checkout: lychee's
        # token only confirms a repo exists, so these went to github.com
        # anonymously and failed on its 503s.
        run: >-
          lychee --include-fragments
          --remap "https://github\.com/agntcy/shadi/(?:blob|tree)/main/(.*) file://$PWD/\$1"
          'docs/content/**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
