name: Cargo Audit

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/cargo-audit.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/cargo-audit.yml"
  # Advisories land without anyone touching this repository, so the scheduled
  # run is the one that actually catches them.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

# Least privilege by default; jobs widen it where they need to.
permissions:
  contents: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-audit

      # Vulnerabilities fail the job. Unmaintained, unsound and yanked crates
      # are reported but do not fail it.
      #
      # `cargo audit` leaves its detail in the log, so a red check says only
      # "Audit fail" until someone opens the run. The report step turns each
      # advisory into an inline annotation and a job summary, including
      # whether a fixed release exists, and owns the exit status.
      - name: Audit the workspace lockfile
        run: cargo audit --json > "$RUNNER_TEMP/audit.json" || true

      - name: Report advisories
        run: python3 scripts/audit_report.py "$RUNNER_TEMP/audit.json"
