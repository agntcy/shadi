name: Cargo Audit

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/cargo-audit.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/cargo-audit.yml"
  # Advisories land without anyone touching this repository, so the scheduled
  # run is the one that actually catches them.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

# Least privilege by default; jobs widen it where they need to.
permissions:
  contents: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-audit

      # Vulnerabilities fail the job. Unmaintained, unsound and yanked crates
      # are reported but do not, because the ones we carry come in through
      # Tauri's GTK3 bindings and have no upstream replacement to move to.
      - name: Audit the workspace lockfile
        run: cargo audit --color always
