name: Publish Project Coverage to Codecov

on:
  # The merge queue tests the tree that will actually land, so these
  # checks must report on merge_group too or the queue waits forever.
  merge_group:
  push:
    branches: [main]
  # Every PR, whatever it targets: a PR stacked on another branch still needs
  # its coverage status, and a required check that never posts blocks forever.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs; a push to main must always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs widen it where they need to.
permissions:
  contents: read

jobs:
  # Required checks cannot use a workflow-level `paths:` filter: a workflow that
  # never triggers leaves its checks pending forever. Gating the job instead
  # keeps the check reporting while skipping the expensive half.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      workspace: ${{ steps.filter.outputs.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Detect changes that affect the Rust workspace
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Anything that is not a pull request always builds.
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "workspace=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null)
          # An empty or failed diff means we cannot tell: build rather than skip.
          if [ -z "$changed" ]; then
            echo "workspace=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          echo "Changed files:"; printf '%s\n' "$changed" | sed 's/^/  /'
          # apps/shadi_desktop is its own workspace and is excluded from every
          # build here, so a desktop-only change cannot affect these jobs.
          if printf '%s\n' "$changed" | grep -qvE '(^docs/|\.md$|^LICENSE$|^CODEOWNERS$|^\.gitignore$|^apps/shadi_desktop/|^\.github/ISSUE_TEMPLATE/)'; then
            echo "workspace=true" >>"$GITHUB_OUTPUT"
          else
            echo "workspace=false" >>"$GITHUB_OUTPUT"
          fi

  coverage:
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    env:
      PYO3_PYTHON: python
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        if: needs.changes.outputs.workspace == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Setup Python
        if: needs.changes.outputs.workspace == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install Linux dependencies
        if: needs.changes.outputs.workspace == 'true'
        run: sudo apt-get update && sudo apt-get install -y pkg-config nettle-dev libssl-dev

      - name: Restore Rust cache
        if: needs.changes.outputs.workspace == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          # Only main writes the cache. PRs still restore from it; letting each
          # PR save its own ~1GB copy pushed the repo past the 10GB ceiling and
          # evicted the very caches the next PR needed.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        if: needs.changes.outputs.workspace == 'true'
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just

      - name: Install LLVM tools
        if: needs.changes.outputs.workspace == 'true'
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        if: needs.changes.outputs.workspace == 'true'
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        if: needs.changes.outputs.workspace == 'true'
        run: just coverage

      - name: Upload combined coverage to Codecov
        if: needs.changes.outputs.workspace == 'true'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: coverage/lcov.info
          flags: rust
          name: rust-coverage
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
