name: Desktop App

on:
  pull_request:
    paths:
      - "apps/shadi_desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches:
      - main
    paths:
      - "apps/shadi_desktop/**"
  workflow_dispatch:

jobs:
  check:
    name: Check (frontend + src-tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shadi_desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.88.0

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/shadi_desktop/src-tauri

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/shadi_desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (tsc + vite)
        run: pnpm build

      - name: Check src-tauri
        working-directory: apps/shadi_desktop/src-tauri
        run: cargo check --locked
