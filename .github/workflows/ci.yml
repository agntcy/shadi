name: CI

on:
  pull_request:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      PYO3_PYTHON: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config nettle-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install python@3.12 nettle pkg-config
      - name: Set Python for PyO3 (macOS)
        if: runner.os == 'macOS'
        run: echo "PYO3_PYTHON=/opt/homebrew/opt/python@3.12/bin/python3.12" >> "$GITHUB_ENV"
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build and test
        run: cargo test --workspace
