name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs widen it where they need to.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      PYO3_PYTHON: python
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: clippy
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - name: Install just
        if: runner.os == 'Windows'
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: just
      - name: Set OpenSSL env vars (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @("C:\Program Files\OpenSSL-Win64", "C:\Program Files\OpenSSL", "C:\OpenSSL-Win64")
          $opensslDir = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $opensslDir) {
            choco install openssl -y --no-progress
            $opensslDir = "C:\Program Files\OpenSSL-Win64"
          }
          $libDir = if (Test-Path "$opensslDir\lib\VC\x64\MD") { "$opensslDir\lib\VC\x64\MD" } else { "$opensslDir\lib" }
          "OPENSSL_DIR=$opensslDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_INCLUDE_DIR=$opensslDir\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config nettle-dev libssl-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install python@3.12 nettle pkg-config
      - name: Set Python for PyO3 (macOS)
        if: runner.os == 'macOS'
        run: echo "PYO3_PYTHON=/opt/homebrew/opt/python@3.12/bin/python3.12" >> "$GITHUB_ENV"
      - name: Validate Linux installer
        if: runner.os == 'Linux'
        run: bash scripts/test_install_shadictl.sh
      - name: Build and test
        if: runner.os != 'Windows'
        run: cargo test --workspace --exclude shadi_desktop
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: just windows-test
      - name: Clippy
        if: runner.os != 'Windows'
        run: cargo clippy --workspace --exclude shadi_desktop --exclude agntcy-shadi-py --exclude agntcy-shadi-cli --all-targets --all-features -- -D warnings -A clippy::field_reassign_with_default -A clippy::too_many_arguments
      - name: Clippy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo clippy --workspace --exclude shadi_desktop --exclude agntcy-shadi-py --exclude agntcy-shadi-cli --all-targets --all-features -- -D warnings -A clippy::field_reassign_with_default -A clippy::too_many_arguments

  lockfiles:
    name: Lockfiles in sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      # `cargo test` below does not pass --locked, so a PR that changes a
      # dependency without committing the lock would pass silently and leave
      # main to resolve it. `cargo metadata` resolves without compiling, so
      # this costs seconds and needs none of Tauri's system deps.
      - name: Check the lockfile is current
        run: |
          if ! cargo metadata --locked --format-version 1 >/dev/null; then
            echo "::error file=Cargo.toml::Cargo.lock is stale. Run cargo metadata, then commit the updated Cargo.lock"
            exit 1
          fi
          echo "Cargo.lock is in sync"
