name: CI

on:
  # The merge queue tests the tree that will actually land, so these
  # checks must report on merge_group too or the queue waits forever.
  merge_group:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs; a push to main must always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs widen it where they need to.
permissions:
  contents: read

jobs:
  # Required checks cannot use a workflow-level `paths:` filter: a workflow that
  # never triggers leaves its checks pending forever. Gating the job instead
  # keeps the check reporting while skipping the expensive half.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      workspace: ${{ steps.filter.outputs.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Detect changes that affect the Rust workspace
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Anything that is not a pull request always builds.
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "workspace=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null)
          # An empty or failed diff means we cannot tell: build rather than skip.
          if [ -z "$changed" ]; then
            echo "workspace=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          echo "Changed files:"; printf '%s\n' "$changed" | sed 's/^/  /'
          # apps/shadi_desktop is its own workspace and is excluded from every
          # build here, so a desktop-only change cannot affect these jobs.
          if printf '%s\n' "$changed" | grep -qvE '(^docs/|\.md$|^LICENSE$|^CODEOWNERS$|^\.gitignore$|^apps/shadi_desktop/|^\.github/ISSUE_TEMPLATE/)'; then
            echo "workspace=true" >>"$GITHUB_OUTPUT"
          else
            echo "workspace=false" >>"$GITHUB_OUTPUT"
          fi

  build-test:
    runs-on: ${{ matrix.os }}
    needs: changes
    permissions:
      contents: read
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      PYO3_PYTHON: python
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust
        if: needs.changes.outputs.workspace == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - name: Setup Python
        if: needs.changes.outputs.workspace == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Restore Rust cache
        if: needs.changes.outputs.workspace == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          # Only main writes the cache. PRs still restore from it; letting each
          # PR save its own ~1GB copy pushed the repo past the 10GB ceiling and
          # evicted the very caches the next PR needed.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install just
        if: runner.os == 'Windows' && needs.changes.outputs.workspace == 'true'
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: just
      - name: Set OpenSSL env vars (Windows)
        if: runner.os == 'Windows' && needs.changes.outputs.workspace == 'true'
        shell: pwsh
        run: |
          $candidates = @("C:\Program Files\OpenSSL-Win64", "C:\Program Files\OpenSSL", "C:\OpenSSL-Win64")
          $opensslDir = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $opensslDir) {
            choco install openssl -y --no-progress
            $opensslDir = "C:\Program Files\OpenSSL-Win64"
          }
          $libDir = if (Test-Path "$opensslDir\lib\VC\x64\MD") { "$opensslDir\lib\VC\x64\MD" } else { "$opensslDir\lib" }
          "OPENSSL_DIR=$opensslDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_INCLUDE_DIR=$opensslDir\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Linux dependencies
        if: runner.os == 'Linux' && needs.changes.outputs.workspace == 'true'
        run: sudo apt-get update && sudo apt-get install -y pkg-config nettle-dev libssl-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS' && needs.changes.outputs.workspace == 'true'
        run: brew install python@3.12 nettle pkg-config
      - name: Set Python for PyO3 (macOS)
        if: runner.os == 'macOS' && needs.changes.outputs.workspace == 'true'
        run: echo "PYO3_PYTHON=/opt/homebrew/opt/python@3.12/bin/python3.12" >> "$GITHUB_ENV"
      - name: Validate Linux installer
        if: runner.os == 'Linux' && needs.changes.outputs.workspace == 'true'
        run: bash scripts/test_install_shadictl.sh
      - name: Build and test
        if: runner.os != 'Windows' && needs.changes.outputs.workspace == 'true'
        run: cargo test --workspace --exclude shadi_desktop
      - name: Build and test (Windows)
        if: runner.os == 'Windows' && needs.changes.outputs.workspace == 'true'
        shell: pwsh
        run: just windows-test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust
        if: needs.changes.outputs.workspace == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Setup Python
        if: needs.changes.outputs.workspace == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Restore Rust cache
        if: needs.changes.outputs.workspace == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux dependencies
        if: needs.changes.outputs.workspace == 'true'
        run: sudo apt-get update && sudo apt-get install -y pkg-config nettle-dev libssl-dev
      # No `-D warnings`: the workspace still carries warn-level lints. This
      # gates clippy's deny-by-default lints, which are hard errors and are how
      # a never_loop bug reached main unnoticed.
      - name: Clippy
        if: needs.changes.outputs.workspace == 'true'
        env:
          PYO3_PYTHON: python
        run: cargo clippy --workspace --exclude shadi_desktop --all-targets

  lockfiles:
    name: Lockfiles in sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      # `cargo test` below does not pass --locked, so a PR that changes a
      # dependency without committing the lock would pass silently and leave
      # main to resolve it. `cargo metadata` resolves without compiling, so
      # this costs seconds and needs none of Tauri's system deps.
      - name: Check the lockfile is current
        run: |
          if ! cargo metadata --locked --format-version 1 >/dev/null; then
            echo "::error file=Cargo.toml::Cargo.lock is stale. Run cargo metadata, then commit the updated Cargo.lock"
            exit 1
          fi
          echo "Cargo.lock is in sync"
