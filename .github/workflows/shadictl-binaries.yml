name: Build CLI Release Artifacts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-shadictl-release-artifacts:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS arm64
            runner: macos-26
            target: aarch64-apple-darwin
          - name: macOS x86_64
            runner: macos-26-intel
            target: x86_64-apple-darwin
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    name: ${{ matrix.name }}
    env:
      PYO3_PYTHON: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config nettle-dev libssl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install nettle pkg-config

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/install_openssl_windows.py

      - name: Resolve shadictl release metadata
        id: metadata
        shell: bash
        run: |
          python scripts/resolve_shadictl_release_metadata.py \
            --cli shadictl \
            --event-name "${{ github.event_name }}" \
            --release-tag "" \
            --target "${{ matrix.target }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build shadictl
        run: cargo build -p agntcy-shadi-cli --release --locked --target ${{ matrix.target }}

      - name: Package shadictl release archive
        id: package
        shell: bash
        run: |
          python scripts/package_shadictl_release.py \
            --binary "${{ steps.metadata.outputs.binary_path }}" \
            --target "${{ matrix.target }}" \
            --version "${{ steps.metadata.outputs.version }}" \
            --name "${{ steps.metadata.outputs.binary_name }}" \
            --output-dir dist \
            --github-output "$GITHUB_OUTPUT"

      - name: Check the imported OpenSSL major (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "${{ steps.metadata.outputs.binary_path }}"
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          $majors = [regex]::Matches($text, 'libcrypto-(\d+)-x64\.dll') |
            ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          $found = $majors -join ","
          Write-Host "$exe imports libcrypto major(s): $(if ($found) { $found } else { 'none' })"
          if ($found -ne $env:OPENSSL_MAJOR) {
            throw "built against OpenSSL $env:OPENSSL_MAJOR, which is what the WinGet dependency installs, but the binary imports '$found'"
          }

      - name: Resolve agentbridge release metadata
        id: metadata-agentbridge
        shell: bash
        run: |
          python scripts/resolve_shadictl_release_metadata.py \
            --cli agentbridge \
            --event-name "${{ github.event_name }}" \
            --release-tag "" \
            --target "${{ matrix.target }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build agentbridge
        run: cargo build -p agntcy-agentbridge-cli --release --locked --target ${{ matrix.target }}

      - name: Package agentbridge release archive
        id: package-agentbridge
        shell: bash
        run: |
          python scripts/package_shadictl_release.py \
            --binary "${{ steps.metadata-agentbridge.outputs.binary_path }}" \
            --target "${{ matrix.target }}" \
            --version "${{ steps.metadata-agentbridge.outputs.version }}" \
            --name "${{ steps.metadata-agentbridge.outputs.binary_name }}" \
            --output-dir dist \
            --github-output "$GITHUB_OUTPUT"
