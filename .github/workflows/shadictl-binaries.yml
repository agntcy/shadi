name: Build CLI Release Artifacts

on:
  # The merge queue tests the tree that will actually land, so these
  # checks must report on merge_group too or the queue waits forever.
  merge_group:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs; a push to main must always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs widen it where they need to.
permissions:
  contents: read

jobs:
  # Required checks cannot use a workflow-level `paths:` filter: a workflow that
  # never triggers leaves its checks pending forever. Gating the job instead
  # keeps the check reporting while skipping the expensive half.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      workspace: ${{ steps.filter.outputs.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Detect changes that affect the Rust workspace
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Anything that is not a pull request always builds.
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "workspace=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null)
          # An empty or failed diff means we cannot tell: build rather than skip.
          if [ -z "$changed" ]; then
            echo "workspace=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          echo "Changed files:"; printf '%s\n' "$changed" | sed 's/^/  /'
          # apps/shadi_desktop is its own workspace and is excluded from every
          # build here, so a desktop-only change cannot affect these jobs.
          if printf '%s\n' "$changed" | grep -qvE '(^docs/|\.md$|^LICENSE$|^CODEOWNERS$|^\.gitignore$|^apps/shadi_desktop/|^\.github/ISSUE_TEMPLATE/)'; then
            echo "workspace=true" >>"$GITHUB_OUTPUT"
          else
            echo "workspace=false" >>"$GITHUB_OUTPUT"
          fi

  build-shadictl-release-artifacts:
    runs-on: ${{ matrix.runner }}
    needs: changes
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS arm64
            runner: macos-26
            target: aarch64-apple-darwin
          - name: macOS x86_64
            runner: macos-26-intel
            target: x86_64-apple-darwin
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    name: ${{ matrix.name }}
    env:
      PYO3_PYTHON: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        if: needs.changes.outputs.workspace == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Setup Python
        if: needs.changes.outputs.workspace == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Restore Rust cache
        if: needs.changes.outputs.workspace == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          # Only main writes the cache. PRs still restore from it; letting each
          # PR save its own ~1GB copy pushed the repo past the 10GB ceiling and
          # evicted the very caches the next PR needed.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && needs.changes.outputs.workspace == 'true'
        run: sudo apt-get update && sudo apt-get install -y pkg-config nettle-dev libssl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS' && needs.changes.outputs.workspace == 'true'
        run: brew install nettle pkg-config

      - name: Resolve shadictl release metadata
        if: needs.changes.outputs.workspace == 'true'
        id: metadata
        shell: bash
        run: |
          python scripts/resolve_shadictl_release_metadata.py \
            --cli shadictl \
            --event-name "${{ github.event_name }}" \
            --release-tag "" \
            --target "${{ matrix.target }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build shadictl
        if: needs.changes.outputs.workspace == 'true'
        run: cargo build -p agntcy-shadi-cli --release --locked --target ${{ matrix.target }}

      - name: Package shadictl release archive
        if: needs.changes.outputs.workspace == 'true'
        id: package
        shell: bash
        run: |
          python scripts/package_shadictl_release.py \
            --binary "${{ steps.metadata.outputs.binary_path }}" \
            --target "${{ matrix.target }}" \
            --version "${{ steps.metadata.outputs.version }}" \
            --name "${{ steps.metadata.outputs.binary_name }}" \
            --output-dir dist \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve agentbridge release metadata
        if: needs.changes.outputs.workspace == 'true'
        id: metadata-agentbridge
        shell: bash
        run: |
          python scripts/resolve_shadictl_release_metadata.py \
            --cli agentbridge \
            --event-name "${{ github.event_name }}" \
            --release-tag "" \
            --target "${{ matrix.target }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build agentbridge
        if: needs.changes.outputs.workspace == 'true'
        run: cargo build -p agntcy-agentbridge-cli --release --locked --target ${{ matrix.target }}

      - name: Package agentbridge release archive
        if: needs.changes.outputs.workspace == 'true'
        id: package-agentbridge
        shell: bash
        run: |
          python scripts/package_shadictl_release.py \
            --binary "${{ steps.metadata-agentbridge.outputs.binary_path }}" \
            --target "${{ matrix.target }}" \
            --version "${{ steps.metadata-agentbridge.outputs.version }}" \
            --name "${{ steps.metadata-agentbridge.outputs.binary_name }}" \
            --output-dir dist \
            --github-output "$GITHUB_OUTPUT"

      - name: Check no OpenSSL DLL is needed (Windows)
        if: runner.os == 'Windows' && needs.changes.outputs.workspace == 'true'
        shell: pwsh
        run: |
          # OpenSSL is vendored into SQLCipher on Windows, so neither binary may
          # import libcrypto: a dynamic link here is a user who cannot start it.
          foreach ($exe in @("${{ steps.metadata.outputs.binary_path }}",
                             "${{ steps.metadata-agentbridge.outputs.binary_path }}")) {
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
            $found = ([regex]::Matches($text, 'libcrypto-(\d+)-x64\.dll') |
              ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique) -join ","
            $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
            Write-Host "$exe ${mb} MB, imports libcrypto major(s): $(if ($found) { $found } else { 'none' })"
            if ($found) {
              throw "$exe imports libcrypto-$found-x64.dll; OpenSSL should be vendored on Windows"
            }
          }
