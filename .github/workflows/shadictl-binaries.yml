name: Build CLI Release Artifacts

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege by default; jobs widen it where they need to.
permissions:
  contents: read

jobs:
  build-shadictl-release-artifacts:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS arm64
            runner: macos-26
            target: aarch64-apple-darwin
          - name: macOS x86_64
            runner: macos-26-intel
            target: x86_64-apple-darwin
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    name: ${{ matrix.name }}
    env:
      PYO3_PYTHON: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config nettle-dev libssl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install nettle pkg-config

      - name: Resolve shadictl release metadata
        id: metadata
        shell: bash
        run: |
          python scripts/resolve_shadictl_release_metadata.py \
            --cli shadictl \
            --event-name "${{ github.event_name }}" \
            --release-tag "" \
            --target "${{ matrix.target }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build shadictl
        run: cargo build -p agntcy-shadi-cli --release --locked --target ${{ matrix.target }}

      - name: Package shadictl release archive
        id: package
        shell: bash
        run: |
          python scripts/package_shadictl_release.py \
            --binary "${{ steps.metadata.outputs.binary_path }}" \
            --target "${{ matrix.target }}" \
            --version "${{ steps.metadata.outputs.version }}" \
            --name "${{ steps.metadata.outputs.binary_name }}" \
            --output-dir dist \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve agentbridge release metadata
        id: metadata-agentbridge
        shell: bash
        run: |
          python scripts/resolve_shadictl_release_metadata.py \
            --cli agentbridge \
            --event-name "${{ github.event_name }}" \
            --release-tag "" \
            --target "${{ matrix.target }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build agentbridge
        run: cargo build -p agntcy-agentbridge-cli --release --locked --target ${{ matrix.target }}

      - name: Package agentbridge release archive
        id: package-agentbridge
        shell: bash
        run: |
          python scripts/package_shadictl_release.py \
            --binary "${{ steps.metadata-agentbridge.outputs.binary_path }}" \
            --target "${{ matrix.target }}" \
            --version "${{ steps.metadata-agentbridge.outputs.version }}" \
            --name "${{ steps.metadata-agentbridge.outputs.binary_name }}" \
            --output-dir dist \
            --github-output "$GITHUB_OUTPUT"

      - name: Check no OpenSSL DLL is needed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # OpenSSL is vendored into SQLCipher on Windows, so neither binary may
          # import libcrypto: a dynamic link here is a user who cannot start it.
          foreach ($exe in @("${{ steps.metadata.outputs.binary_path }}",
                             "${{ steps.metadata-agentbridge.outputs.binary_path }}")) {
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
            $found = ([regex]::Matches($text, 'libcrypto-(\d+)-x64\.dll') |
              ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique) -join ","
            $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
            Write-Host "$exe ${mb} MB, imports libcrypto major(s): $(if ($found) { $found } else { 'none' })"
            if ($found) {
              throw "$exe imports libcrypto-$found-x64.dll; OpenSSL should be vendored on Windows"
            }
          }
