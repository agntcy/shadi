# A member of the root workspace, but deliberately left out of its
# default-members: `cargo build`, `cargo clippy` and `cargo test --workspace
# --exclude shadi_desktop` therefore never build this crate, and none of the
# other workflows need Tauri's Linux system deps (webkit2gtk, glib, ...).
# Being a member is what keeps its dependencies in the one root lock, so the
# lock cannot fall behind a release the way a second workspace's did (#194).

[package]
name = "shadi_desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "SHADI Desktop — a native control-plane app for shadictl, agentbridge, and the SHADI shell."
license = "Apache-2.0"
repository = "https://github.com/agntcy/shadi"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shadi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
agentbridge = { package = "agntcy-agentbridge", version = "0.1.1", path = "../../../crates/agentbridge" }
shadi_mas = { package = "agntcy-shadi-mas", version = "0.1.1", path = "../../../crates/shadi_mas" }
uuid = { version = "1", features = ["v4"] }

# Kept in step with the root SHADI workspace. The `=` pins these carried are
# gone: they existed because a2a-slimrpc required older
# agntcy-slim-service/agntcy-slim-proto, which 0.2.5 no longer does.
slim = { package = "agntcy-slim", version = "2.3.0" }
slim_rpc = { package = "agntcy-slim-rpc", version = "2.3.0" }
slim_bindings = { package = "agntcy-slim-bindings", version = "2.3.0" }
slim_proto = { package = "agntcy-slim-proto", version = "0.6.0" }
slim_config = { package = "agntcy-slim-config", version = "0.16.0" }
shadi_identity = { package = "agntcy-shadi-identity", version = "0.1.0", path = "../../../crates/shadi_identity" }
shadi_sandbox = { package = "agntcy-shadi-sandbox", version = "0.1.2", path = "../../../crates/shadi_sandbox" }
agent_secrets = { package = "agntcy-shadi-agent-secrets", version = "0.2.0", path = "../../../crates/agent_secrets" }
# mTLS bootstrap without an openssl binary — the desktop app has to work on a
# clean Windows install too (agntcy/shadi#123).
rcgen = { version = "0.14", features = ["pem"] }
# Reading github.com/<handle>.keys; rustls-tls to match the rest of the stack
# and avoid an openssl dependency.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
futures = "0.3"
tauri-plugin-dialog = "2.7.2"


[dev-dependencies]
tempfile = "3.27"
# Building an ssh-ed25519 public-key line for the GitHub-handle tests.
base64 = "0.22"
ed25519-dalek = "2.2"
# Building OpenSSH key fixtures for the 1Password field tests.
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519"] }
