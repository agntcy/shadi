[workspace]
release_always = false
publish = true
# A library crate's artifact is the crates.io release; a GitHub release for it
# carries no assets. Only the two crates that ship binaries get one.
git_release_enable = false
publish_no_verify = true
publish_timeout = "30m"

[[package]]
name = "shadi_demo_bot"
publish = false
release = false

[[package]]
name = "agentbridge_demo"
publish = false
release = false

[[package]]
name = "shadi_desktop"
publish = false
release = false

[[package]]
name = "agntcy-shadi-cli"
git_release_enable = true
semver_check = false
# The root CHANGELOG is the workspace-wide view, so release-plz owns it rather
# than anyone maintaining it by hand — the hand-written one had drifted twelve
# days and two releases behind. Paths are relative to the root Cargo.toml, so
# shadictl no longer keeps a crate-local changelog.
changelog_path = "CHANGELOG.md"
changelog_include = [
  "agntcy-agentbridge",
  "agntcy-agentbridge-cli",
  "agntcy-shadi-a2a",
  "agntcy-shadi-agent-secrets",
  "agntcy-shadi-agent-transport-slim",
  "agntcy-shadi-identity",
  "agntcy-shadi-mas",
  "agntcy-shadi-memory",
  "agntcy-shadi-py",
  "agntcy-shadi-sandbox",
  "agntcy-shadi-slim-mas",
  "agntcy-shadi-telemetry",
]

[[package]]
name = "agntcy-agentbridge-cli"
git_release_enable = true
semver_check = false

# cargo-semver-checks builds rustdoc for the published baseline as well as the
# current tree, and every baseline on crates.io predates the slim-persistence
# pin, so it still resolves two mls-rs trees and fails to compile. The crates
# that do not pull slim keep the check. Re-enable these once a pinned version
# of each has been published (agntcy/shadi#338).
[[package]]
name = "agntcy-agentbridge"
semver_check = false

[[package]]
name = "agntcy-shadi-a2a"
semver_check = false

[[package]]
name = "agntcy-shadi-agent-transport-slim"
semver_check = false

[[package]]
name = "agntcy-shadi-identity"
semver_check = false

[[package]]
name = "agntcy-shadi-mas"
semver_check = false
