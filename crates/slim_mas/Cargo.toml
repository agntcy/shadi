[package]
name = "agntcy-shadi-slim-mas"
version = "0.1.3"
edition = "2021"
description = "Managed agent set configuration helpers for SHADI SLIM deployments."
license.workspace = true
repository.workspace = true

[lib]
name = "slim_mas"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = { version = "0.9", features = ["serde"] }
agent_secrets = { package = "agntcy-shadi-agent-secrets", version = "0.2.1", path = "../agent_secrets" }

[dev-dependencies]
tempfile = "3.27"
