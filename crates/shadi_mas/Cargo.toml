[package]
name = "agntcy-shadi-mas"
version = "0.1.4"
edition = "2021"
rust-version.workspace = true
description = "Coordination runtime for SHADI multi-agent systems."
license.workspace = true
repository.workspace = true

[lib]
name = "shadi_mas"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
a2a = { package = "a2a-lf", version = "0.3.0" }
a2a-client = { package = "a2a-client-lf", version = "0.2.1" }
agent_secrets = { package = "agntcy-shadi-agent-secrets", version = "0.2.1", path = "../agent_secrets" }
shadi_identity = { package = "agntcy-shadi-identity", version = "0.1.3", path = "../shadi_identity" }
agent_transport_slim = { package = "agntcy-shadi-agent-transport-slim", version = "0.2.3", path = "../agent_transport_slim" }
shadi_a2a = { package = "agntcy-shadi-a2a", version = "0.1.4", path = "../shadi_a2a" }
slim_bindings = { package = "agntcy-slim-bindings", version = "2.3.0" }
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
