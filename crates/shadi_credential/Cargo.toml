[package]
name = "agntcy-shadi-credential"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Verifiable credential vault and SD-JWT handling for SHADI."
license.workspace = true
repository.workspace = true

[lib]
name = "shadi_credential"

[dependencies]
agent_secrets = { package = "agntcy-shadi-agent-secrets", version = "0.4.1", path = "../agent_secrets" }
shadi_identity = { package = "agntcy-shadi-identity", version = "0.3.0", path = "../shadi_identity" }
shadi_memory = { package = "agntcy-shadi-memory", version = "0.2.1", path = "../shadi_memory" }
base64 = "0.23"
ed25519-dalek = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
