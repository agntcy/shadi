[package]
name = "agntcy-agentbridge"
version = "0.4.0"
edition = "2021"
rust-version.workspace = true
description = "General-purpose agent interconnect over A2A, built on shadi_mas."
license.workspace = true
repository.workspace = true

[lib]
name = "agentbridge"

[dependencies]
shadi_mas = { package = "agntcy-shadi-mas", version = "0.5.0", path = "../shadi_mas" }
shadi_a2a = { package = "agntcy-shadi-a2a", version = "0.3.0", path = "../shadi_a2a" }
shadi_identity = { package = "agntcy-shadi-identity", version = "0.3.0", path = "../shadi_identity" }
a2a = { package = "a2a-lf", version = "0.4.1" }
a2a-server = { package = "a2a-server-lf", version = "0.5.1" }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["process", "io-util", "rt", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2.0"
tracing = "0.1"
time = { version = "0.3", features = ["formatting"] }

# Killing a tracked child by pid: signals on unix, TerminateProcess on windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27"
