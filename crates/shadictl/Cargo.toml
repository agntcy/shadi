[package]
name = "agntcy-shadi-cli"
version = "0.3.0"
edition = "2021"
rust-version = "1.98"
description = "Command-line interface for SHADI policy, secrets, memory, and SLIM operations."
license.workspace = true
repository.workspace = true

[[bin]]
name = "shadictl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
a2a = { package = "a2a-lf", version = "0.4.2" }
a2a-client = { package = "a2a-client-lf", version = "0.2.9" }
a2a-server = { package = "a2a-server-lf", version = "0.5.3" }
async-trait = "0.1"
futures = "0.3"
shadi_sandbox = { package = "agntcy-shadi-sandbox", version = "0.3.0", path = "../shadi_sandbox" }
agent_transport_slim = { package = "agntcy-shadi-agent-transport-slim", version = "0.5.1", path = "../agent_transport_slim" }
agent_secrets = { package = "agntcy-shadi-agent-secrets", version = "0.4.2", path = "../agent_secrets", features = ["onepassword"] }
shadi_a2a = { package = "agntcy-shadi-a2a", version = "0.4.0", path = "../shadi_a2a" }
shadi_memory = { package = "agntcy-shadi-memory", version = "0.2.2", path = "../shadi_memory" }
shadi_credential = { package = "agntcy-shadi-credential", version = "0.1.0", path = "../shadi_credential" }
shadi_telemetry = { package = "agntcy-shadi-telemetry", version = "0.2.0", path = "../shadi_telemetry" }
slim_mas = { package = "agntcy-shadi-slim-mas", version = "0.1.7", path = "../slim_mas" }
agentbridge = { package = "agntcy-agentbridge", version = "0.5.1", path = "../agentbridge" }
slim_bindings = { package = "agntcy-slim-bindings", version = "3.4.3" }
# Not used directly: holds the transitive mls-rs line together. slim-persistence
# 0.1.1 moved to mls-rs 0.56 in a patch release while slim-mls 0.3.10 is on 0.54,
# so an unpinned resolve links both (agntcy/shadi#338, agntcy/slim#2142).
slim_persistence = { package = "agntcy-slim-persistence", version = "=0.2.1" }
slim_rpc = { package = "agntcy-slim-rpc", version = "3.4.3" }
slim_proto = { package = "agntcy-slim-proto", version = "0.8.5" }
slim_config = { package = "agntcy-slim-config", version = "0.17.7" }
tonic = { version = "0.14" }
uuid = { version = "1", features = ["v4"] }
shadi_identity = { package = "agntcy-shadi-identity", version = "0.4.0", path = "../shadi_identity", features = ["openpgp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bs58 = "0.5"
base64 = "0.23"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hkdf = "0.13"
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tracing = "0.1"
rustyline = "15"
libc = "0.2"
unicode-width = "0.2"
ctrlc = "3.5"
signal-hook = "0.4"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_Pipes",
] }

[dev-dependencies]
# OpenPGP certificate fixtures; the parsing itself is in shadi_identity.
sequoia-openpgp = { version = "2.2", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto", "compression-deflate", "compression-bzip2"] }
# Building OpenSSH key fixtures for the SSH identity tests (agntcy/shadi#140).
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519"] }
tempfile = "3.27"
shadi_identity = { package = "agntcy-shadi-identity", version = "0.4.0", path = "../shadi_identity", features = ["openpgp"] }
