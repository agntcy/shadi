[package]
name = "shadictl"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
shadi_sandbox = { path = "../shadi_sandbox" }
agent_secrets = { path = "../agent_secrets", features = ["onepassword"] }
shadi_memory = { path = "../shadi_memory" }
shadi_telemetry = { path = "../shadi_telemetry" }
slim_mas = { path = "../slim_mas" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bs58 = "0.5"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hkdf = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tracing = "0.1"
rustyline = "15"
libc = "0.2"
unicode-width = "0.2"
ctrlc = "3.4"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
sequoia-openpgp = { version = "2.2", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto", "compression-deflate", "compression-bzip2"] }
uds_windows = "1.2"
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_Pipes",
] }

[target.'cfg(not(windows))'.dependencies]
sequoia-openpgp = { version = "2.2" }

[dev-dependencies]
tempfile = "3.10"
