[package]
name = "agntcy-shadi-identity"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
name = "shadi_identity"

[dependencies]
ed25519-dalek = { version = "2.2", features = ["pkcs8", "pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
getrandom = "0.2"
bs58 = "0.5"
base64 = "0.22"
serde_json = "1.0"
slim_bindings = { package = "agntcy-slim-bindings", version = "2.0.0-alpha.7" }

[dev-dependencies]
