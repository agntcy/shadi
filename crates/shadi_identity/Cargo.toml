[package]
name = "agntcy-shadi-identity"
version = "0.3.1"
edition = "2021"
description = "Ed25519 did:key agent identity primitives for SHADI."
license.workspace = true
repository.workspace = true

[lib]
name = "shadi_identity"

[dependencies]
ed25519-dalek = { version = "2.2", features = ["pkcs8", "pem"] }
pkcs8 = { version = "0.11", features = ["pem"] }
getrandom = "0.4"
bs58 = "0.5"
base64 = "0.23"
serde_json = "1.0"
hkdf = "0.13"
sha2 = "0.11"
slim_bindings = { package = "agntcy-slim-bindings", version = "3.0.1" }
# Not used directly: holds the transitive mls-rs line together. slim-persistence
# 0.1.1 moved to mls-rs 0.56 in a patch release while slim-mls 0.3.10 is on 0.54,
# so an unpinned resolve links both (agntcy/shadi#338, agntcy/slim#2142).
slim_persistence = { package = "agntcy-slim-persistence", version = "=0.2.0" }
# OpenSSH key parsing for the SSH-rooted identity source (agntcy/shadi#140).
# `encryption` brings bcrypt-pbkdf so passphrase-protected keys work.
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "encryption", "rand_core", "getrandom"] }
# `did-from-gpg`: reading the Ed25519 key out of an OpenPGP certificate.
sequoia-openpgp = { version = "2.2", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto", "compression-deflate", "compression-bzip2"], optional = true }

[features]
openpgp = ["dep:sequoia-openpgp"]

[dev-dependencies]
slim_config = { package = "agntcy-slim-config", version = "0.16.5" }
slim_auth = { package = "agntcy-slim-auth", version = "0.16.3" }
tokio = { version = "1", features = ["full"] }
