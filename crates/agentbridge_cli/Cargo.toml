[package]
name = "agntcy-agentbridge-cli"
version = "0.2.0"
edition = "2021"
rust-version.workspace = true
description = "CLI binary for the agentbridge general-purpose agent interconnect."
license.workspace = true
repository.workspace = true

[[bin]]
name = "agentbridge"
path = "src/main.rs"

[dependencies]
agentbridge = { package = "agntcy-agentbridge", version = "0.4.0", path = "../agentbridge" }
agent_transport_slim = { package = "agntcy-shadi-agent-transport-slim", version = "0.4.0", path = "../agent_transport_slim" }
shadi_mas = { package = "agntcy-shadi-mas", version = "0.5.0", path = "../shadi_mas" }
shadi_a2a = { package = "agntcy-shadi-a2a", version = "0.3.0", path = "../shadi_a2a" }
shadi_telemetry = { package = "agntcy-shadi-telemetry", version = "0.1.3", path = "../shadi_telemetry" }
slim_bindings = { package = "agntcy-slim-bindings", version = "3.0.1" }
# Not used directly: holds the transitive mls-rs line together. slim-persistence
# 0.1.1 moved to mls-rs 0.56 in a patch release while slim-mls 0.3.10 is on 0.54,
# so an unpinned resolve links both (agntcy/shadi#338, agntcy/slim#2142).
slim_persistence = { package = "agntcy-slim-persistence", version = "=0.2.0" }
slim_config = { package = "agntcy-slim-config", version = "0.16.5" }
slim_rpc = { package = "agntcy-slim-rpc", version = "3.0.1" }
a2a = { package = "a2a-lf", version = "0.4.1" }
a2a-server = { package = "a2a-server-lf", version = "0.5.1" }
a2a-grpc = { version = "0.3.9" }
a2a-pb = { version = "0.3.1" }
tonic = { version = "0.14", features = ["transport"] }
tonic-tls = { version = "0.7", default-features = false, features = ["rustls"] }
rustls-pki-types = "1.9"
agent_secrets = { package = "agntcy-shadi-agent-secrets", version = "0.4.1", path = "../agent_secrets" }
shadi_identity = { package = "agntcy-shadi-identity", version = "0.3.0", path = "../shadi_identity" }
shadi_sandbox = { package = "agntcy-shadi-sandbox", version = "0.3.0", path = "../shadi_sandbox" }
async-trait = "0.1"
futures = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1.0"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"

[dev-dependencies]
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
tower = { version = "0.5", features = ["util"] }
tracing-opentelemetry = "0.33"
