[package]
name = "agntcy-agentbridge-cli"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "CLI binary for the agentbridge coding-agent interconnect."
license.workspace = true
repository.workspace = true

[[bin]]
name = "agentbridge"
path = "src/main.rs"

[dependencies]
agentbridge = { package = "agntcy-agentbridge", version = "0.1.0", path = "../agentbridge" }
shadi_mas = { package = "agntcy-shadi-mas", version = "0.1.1", path = "../shadi_mas" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
