[package]
name = "agntcy-shadi-a2a"
version = "0.1.7"
edition = "2021"
rust-version = "1.98"
description = "A2A channel support for SHADI (SLIMRPC, gRPC, JSON-RPC, and HTTP+JSON)."
license.workspace = true
repository.workspace = true

[lib]
name = "shadi_a2a"

[dependencies]
agent_secrets = { package = "agntcy-shadi-agent-secrets", version = "0.4.0", path = "../agent_secrets" }
a2a = { package = "a2a-lf", version = "0.3.0" }
a2a-client = { package = "a2a-client-lf", version = "0.2.1" }
a2a-server = { package = "a2a-server-lf", version = "0.4.1" }
a2a-slimrpc = { package = "a2a-slimrpc", version = "0.2.5" }
a2a-grpc = { version = "0.3.5" }
a2a-pb = { version = "0.2.0" }
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slim_bindings = { package = "agntcy-slim-bindings", version = "2.3.0" }
# Not used directly: holds the transitive mls-rs line together. slim-persistence
# 0.1.1 moved to mls-rs 0.56 in a patch release while slim-mls 0.3.10 is on 0.54,
# so an unpinned resolve links both (agntcy/shadi#338, agntcy/slim#2142).
slim_persistence = { package = "agntcy-slim-persistence", version = "=0.1.0" }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tonic = { version = "0.14", features = ["transport"] }
