[package]
name = "agntcy-shadi-memory"
version = "0.1.3"
edition = "2021"
description = "Encrypted local memory storage for SHADI using SQLCipher."
license.workspace = true
repository.workspace = true

[lib]
name = "shadi_memory"

[dependencies]
agent_secrets = { package = "agntcy-shadi-agent-secrets", version = "0.2.1", path = "../agent_secrets" }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3.27"
