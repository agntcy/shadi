[package]
name = "shadi_memory"
version = "0.1.0"
edition = "2021"
description = "Encrypted local memory storage for SHADI using SQLCipher."
license.workspace = true
repository.workspace = true

[dependencies]
agent_secrets = { version = "0.1.0", path = "../agent_secrets" }
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3.10"
