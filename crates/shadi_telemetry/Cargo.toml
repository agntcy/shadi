[package]
name = "agntcy-shadi-telemetry"
version = "0.1.1"
edition = "2021"
description = "OpenTelemetry initialization and tracing sinks for SHADI runtimes and tools."
license.workspace = true
repository.workspace = true

[lib]
name = "shadi_telemetry"

[dependencies]
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-blocking-client"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["json"] }
tracing-appender = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
