[package]
name = "agent_secrets"
version = "0.1.0"
edition = "2021"
description = "Keychain-backed secret storage and access verification for SHADI."
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = []
onepassword = ["serde", "serde_json", "base64"]
windows = []
macos = []
ios = []
android = []
linux = []
coverage = []

[dependencies]
zeroize = "1.7"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.10"
security-framework-sys = "2.15"
