[package]
name = "agntcy-shadi-agent-secrets"
version = "0.4.2"
edition = "2021"
description = "Keychain-backed secret storage and access verification for SHADI."
license.workspace = true
repository.workspace = true

[lib]
name = "agent_secrets"

[features]
default = ["std"]
std = []
onepassword = ["serde", "serde_json", "base64"]
windows = []
macos = []
ios = []
android = []
linux = []
coverage = []

[dependencies]
zeroize = "1.8"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
base64 = { version = "0.23", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"
security-framework-sys = "2.17"

[target.'cfg(target_os = "linux")'.dependencies]
# Links the distro's libcrypto, like shadi_memory; building needs libssl-dev.
rusqlite = { workspace = true, features = ["bundled-sqlcipher"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3.27"
