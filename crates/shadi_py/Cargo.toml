[package]
name = "shadi_py"
version = "0.1.0"
edition = "2021"
description = "PyO3 Python bindings for SHADI runtime services."
license.workspace = true
repository.workspace = true

[lib]
name = "shadi"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
agent_secrets = { version = "0.1.0", path = "../agent_secrets", features = ["onepassword"] }
shadi_memory = { version = "0.1.0", path = "../shadi_memory" }
shadi_sandbox = { version = "0.1.0", path = "../shadi_sandbox" }
shadi_telemetry = { version = "0.1.0", path = "../shadi_telemetry" }
tracing = "0.1"

[dependencies.pyo3]
version = "0.21"
features = ["extension-module"]

[build-dependencies]
pyo3-build-config = "0.21"
