[package]
name = "shadi_py"
version = "0.1.0"
edition = "2021"

[lib]
name = "shadi"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
agent_secrets = { path = "../agent_secrets", features = ["onepassword"] }
shadi_memory = { path = "../shadi_memory" }
shadi_sandbox = { path = "../shadi_sandbox" }
shadi_telemetry = { path = "../shadi_telemetry" }
tracing = "0.1"

[dependencies.pyo3]
version = "0.21"
features = ["extension-module"]

[build-dependencies]
pyo3-build-config = "0.21"
